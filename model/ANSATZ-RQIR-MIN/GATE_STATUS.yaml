notes:
  - QG-001 and QG-002 PASS mean the foundational objects are explicitly specified, not that all consistency consequences have already passed.
  - C5 degeneracy is expected and must be tested; it would reject novelty, not consistency.
  - No gate is upgraded from BLOCKED/NOT_TESTED without a repository derivation or reproducible certificate.
