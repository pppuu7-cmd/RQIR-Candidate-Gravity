name: RCG Iter010 G28 Full Bloch Sphere Master Equation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/iter010_full_bloch_master_equation.py'
      - '.github/workflows/rcg-iter010-full-bloch.yml'
  workflow_dispatch:

jobs:
  full-bloch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        scale: ['0.5','1.0','2.0','4.0']
        theta: ['0.025','0.05','0.10','0.20','0.35','0.50']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy
      - name: Run G28 full-Bloch audit
        run: |
          mkdir -p out
          TAG="s${{ matrix.scale }}-t${{ matrix.theta }}"
          python scripts/iter010_full_bloch_master_equation.py --scale '${{ matrix.scale }}' --theta '${{ matrix.theta }}' --tag "$TAG" --out "out/$TAG.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rcg010-s${{ matrix.scale }}-t${{ matrix.theta }}
          path: out/*.json

  aggregate:
    if: always()
    needs: full-bloch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate G28
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          s={
            'iteration':'Iter010','gate':'G28','n_results':len(rows),
            'structural_passes':sum(bool(r['pass']) for r in rows),
            'nonzero_gap_count':sum(bool(r['scientific_support']['nonzero_full_sphere_gap']) for r in rows),
            'offplane_improvement_count':sum(bool(r['scientific_support']['off_plane_improves_xz_by_1pct']) for r in rows),
            'max_improvement_vs_xz':max([r['improvement_vs_XZ'] for r in rows],default=None),
            'max_improvement_vs_zz':max([r['improvement_vs_ZZ'] for r in rows],default=None),
            'min_full_sphere_gap':min([r['best_full_sphere']['td'] for r in rows],default=None),
            'all_structural_pass':len(rows)==24 and all(r['pass'] for r in rows),
            'scope_lock':'Finite two-qubit Markovian single-axis-per-site comparator family only.'
          }
          os.makedirs('summary',exist_ok=True)
          open('summary/summary.json','w').write(json.dumps(s,indent=2)); print(json.dumps(s,indent=2))
          if not s['all_structural_pass']: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg010-summary
          path: summary/summary.json
