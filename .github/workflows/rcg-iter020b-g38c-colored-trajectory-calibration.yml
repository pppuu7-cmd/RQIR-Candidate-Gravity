name: RCG Iter020B G38-C Colored Trajectory Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER020B_G38C_LAUNCH.md'

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G38-C trajectory calibration lane
        run: |
          mkdir -p out
          python scripts/iter020b_g38c_colored_trajectory_calibration.py --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg020b-g38c-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: calibrate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G38-C rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          methods=('sobol_lsq','lhs_lsq'); tol=0.002
          structural=bool(len(rows)==12 and all(r['structural_valid'] for r in rows))
          bm={}
          for m in methods:
              rr=[r for r in rows if r['method']==m]
              bm[m]={'n':len(rr),'support_count':sum(int(r['result']['scientific_support']) for r in rr),'worst_max_trace_gap':max((r['result']['max_trace_gap'] for r in rr),default=None),'all_support':bool(len(rr)==6 and all(r['result']['scientific_support'] for r in rr))}
          support=bool(structural and all(bm[m]['all_support'] for m in methods))
          s={'iteration':'Iter020B','gate':'G38-C','n_results':len(rows),'all_structural_valid':structural,'by_method':bm,'scientific_support':support,'frozen_max_per_time_trace_distance':tol,'times':[0.25,0.5,1.0],'interpretation':'Prospective in-family three-time OU trajectory optimizer calibration only. PASS authorizes a separate multi-time RCG-002 adversarial test.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(s,indent=2)); print(json.dumps(s,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg020b-g38c-summary
          path: summary/summary.json
