name: RCG Iter018C G36-A Shared Noise Adversarial

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER018C_G36A_LAUNCH.md'

jobs:
  adversarial:
    strategy:
      fail-fast: false
      matrix:
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run prospectively frozen G36-A lane
        run: |
          mkdir -p out
          python scripts/iter018c_g36a_shared_noise_adversarial.py --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg018c-g36a-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: adversarial
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G36-A rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          methods=('sobol_lsq','lhs_lsq'); nz=1e-4; agree=0.002
          structural=bool(len(rows)==8 and all(r['structural_valid'] for r in rows))
          shards={}
          for s in range(4):
              rr={r['method']:r for r in rows if r['shard']==s}
              gaps={m:rr[m]['result']['best_trace_gap'] for m in methods if m in rr}
              both=bool(len(gaps)==2 and all(v>nz for v in gaps.values()))
              agreement=bool(len(gaps)==2 and abs(gaps['sobol_lsq']-gaps['lhs_lsq'])<=agree)
              shards[str(s)]={'gaps':gaps,'both_nonzero':both,'cross_method_agreement':agreement,'scientific_support':bool(both and agreement)}
          support=bool(structural and all(x['scientific_support'] for x in shards.values()))
          summary={'iteration':'Iter018C','gate':'G36-A','n_results':len(rows),'all_structural_valid':structural,'per_shard':shards,'scientific_support':support,'frozen_rules':{'nonzero_gap':nz,'cross_method_agreement':agree},'interpretation':'Support, if any, is restricted to the calibrated finite shared Gaussian classical Hamiltonian-noise family and is not a general classical/semiclassical no-go.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg018c-g36a-summary
          path: summary/summary.json
