name: RCG Iter058 G60 four-derivative escape space

on:
  push:
    paths:
      - '.github/workflows/rcg-iter058-g60-four-derivative-escape.yml'
  workflow_dispatch:

jobs:
  stream:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        stream: [A, B, C, D]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - run: python scripts/iter058_g60_four_derivative_escape_space.py --stream ${{ matrix.stream }} --out out/${{ matrix.stream }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g60-${{ matrix.stream }}
          path: out/${{ matrix.stream }}.json

  aggregate:
    needs: stream
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - uses: actions/download-artifact@v4
        with:
          pattern: g60-*
          path: downloaded
      - run: find downloaded -maxdepth 3 -type f -print
      - run: python scripts/iter058_g60_four_derivative_escape_space.py --aggregate-dir downloaded --out summary/g60_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: g60-aggregate
          path: summary/g60_summary.json
