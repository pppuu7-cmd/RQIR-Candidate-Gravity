name: RCG Iter026B G42-BC Basis Chart Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER026B_G42BC_LAUNCH.md'

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        rank: [1, 2, 3, 4, 5, 6]
        panel: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G42-BC audit lane
        run: |
          mkdir -p out
          python scripts/iter026b_g42bc_basis_chart_audit.py --rank '${{ matrix.rank }}' --panel '${{ matrix.panel }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg026b-g42bc-r${{ matrix.rank }}-p${{ matrix.panel }}
          path: out/result.json

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G42-BC rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==24 and all(r['structural_valid'] for r in rows))
          cov=bool(structural and all(r['basis_covariance']['support'] for r in rows))
          inside=sum(int(r['chart_coverage']['inside_frozen_chart']) for r in rows)
          if not cov: cls='BASIS_COVARIANCE_IMPLEMENTATION_FAIL'
          elif inside==24: cls='BOUNDED_CHART_ROTATION_COVERAGE_PASS_ON_PANEL'
          else: cls='BOUNDED_CHART_ROTATION_COVERAGE_LIMIT_FOUND'
          by_rank={}
          for rank in range(1,7):
              rr=[r for r in rows if r['rank']==rank]
              by_rank[str(rank)]={'n':len(rr),'covariance_support_count':sum(int(r['basis_covariance']['support']) for r in rr),'inside_chart_count':sum(int(r['chart_coverage']['inside_frozen_chart']) for r in rr),'max_generator_covariance_error':max((r['basis_covariance']['relative_generator_error'] for r in rr),default=None),'max_diagonal_coordinate':max((r['chart_coverage']['max_diagonal_coordinate'] for r in rr),default=None),'max_abs_offdiagonal_coordinate':max((r['chart_coverage']['max_abs_offdiagonal_coordinate'] for r in rr),default=None)}
          summary={'iteration':'Iter026B','gate':'G42-BC','n_results':len(rows),'all_structural_valid':structural,'all_basis_covariance_support':cov,'inside_frozen_chart_count':inside,'outside_frozen_chart_count':len(rows)-inside,'by_rank':by_rank,'classification':cls,
                   'interpretation':'Response-blind basis/chart diagnostic only. Coverage limits constrain basis-invariant interpretation of G42-A but do not alter its numerical bounded-chart result.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg026b-g42bc-summary
          path: summary/summary.json
