name: RCG Iter029 G40-TM-C Trace-Metric RTN Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER029_G40TMC_LAUNCH.md'

jobs:
  calibrate:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        method: [sobol_powell, lhs_powell]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G40-TM-C calibration lane
        run: |
          mkdir -p out
          python scripts/iter029_g40tmc_trace_metric_rtn_calibration.py --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg029-g40tmc-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: calibrate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G40-TM-C rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==8 and all(r['structural_valid'] for r in rows))
          support=bool(structural and all(r['scientific_support'] for r in rows))
          by_shard={}
          for s in range(4):
              rr=[r for r in rows if r['shard']==s]
              gaps=[r['best_strict_candidate']['gap'] for r in rr if r['best_strict_candidate'] is not None]
              blps=[r['best_strict_candidate']['axis_covariant_BLP'] for r in rr if r['best_strict_candidate'] is not None]
              by_shard[str(s)]={'n':len(rr),'support_count':sum(int(r['scientific_support']) for r in rr),'best_gaps':gaps,'min_recovered_BLP':min(blps) if blps else None,'cross_method_gap_difference':abs(gaps[0]-gaps[1]) if len(gaps)==2 else None}
          summary={
              'iteration':'Iter029','gate':'G40-TM-C','n_results':len(rows),'all_structural_valid':structural,
              'scientific_support':support,'by_shard':by_shard,
              'classification':'TRACE_METRIC_ALIGNED_RTN_OPTIMIZER_CALIBRATED' if support else 'TRACE_METRIC_ALIGNED_RTN_CALIBRATION_NOT_ESTABLISHED',
              'interpretation':'Response-blind positive-control optimizer calibration only. Cannot alter old G40 terminal results or raise readiness.'
          }
          os.makedirs('summary',exist_ok=True)
          open('summary/summary.json','w').write(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg029-g40tmc-summary
          path: summary/summary.json
