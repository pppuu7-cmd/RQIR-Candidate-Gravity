name: RCG Iter074 G76 C-D near-alias conditioning robustness
on:
  push:
    branches: [main]
    paths:
      - 'scripts/iter074_g76_cd_near_alias_conditioning_robustness.py'
      - 'prereg/ITER074_G76_CD_NEAR_ALIAS_CONDITIONING_ROBUSTNESS.md'
      - '.github/workflows/iter074_g76_cd_near_alias_conditioning_robustness.yml'
  workflow_dispatch:

jobs:
  lane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy mpmath
      - name: Run frozen scientific stream
        run: python scripts/iter074_g76_cd_near_alias_conditioning_robustness.py --lane ${{ matrix.lane }} --out g76-${{ matrix.lane }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g76-${{ matrix.lane }}
          path: g76-${{ matrix.lane }}.json

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g76-*
          path: raw
          merge-multiple: true
      - name: Apply frozen aggregate
        shell: python
        run: |
          import json, pathlib, sys
          expected={
            'A':'DIRECT_ANCHOR_STRENGTH_CONDITIONING_SCOPED',
            'B':'NEAR_SHAPE_APPROACH_TO_ALIAS_CONDITIONING_SCOPED',
            'C':'HELDOUT_AND_ORTHOGONAL_COORDINATE_ROBUSTNESS_SCOPED',
            'D':'PRECISION_CONVERGENCE_AND_FALSE_POSITIVE_CALIBRATION_SCOPED'}
          rows={}
          for p in pathlib.Path('raw').glob('g76-*.json'):
            r=json.loads(p.read_text()); rows[r['stream']]=r
          complete=(set(rows)==set(expected))
          scientific_fail=(complete and any(not rows[k].get('valid',False) for k in expected))
          valid=(complete and all(rows[k].get('valid') and rows[k].get('classification')==v for k,v in expected.items()))
          if valid:
            cls='G75_EXACT_IDENTIFIABILITY_DEGRADES_CONTINUOUSLY_TOWARD_ALIAS_SCOPED'
          elif scientific_fail:
            cls='SCIENTIFIC_FAIL_FROZEN_NEAR_ALIAS_ROBUSTNESS_PREDICATE'
          else:
            cls='INFRASTRUCTURE_OR_GATE_INVALID'
          out={'valid':valid,'lane_classifications':{k:rows[k]['classification'] for k in sorted(rows)},'classification':cls,'readiness':66,'theory_established':0,'scope_lock':'Frozen normalized numerical identifiability robustness only; no physical detectability threshold, architecture selection, anchor realizability, candidate law, or new physics.'}
          pathlib.Path('g76-aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          if not valid: sys.exit(2)
      - uses: actions/upload-artifact@v4
        with:
          name: g76-aggregate
          path: g76-aggregate.json
