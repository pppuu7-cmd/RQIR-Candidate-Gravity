name: RCG Iter012 G30 Multi-Channel Comparator

on:
  push:
    branches: [main]
    paths:
      - 'scripts/iter012_multichannel_comparator.py'
      - '.github/workflows/rcg-iter012-multichannel.yml'
  workflow_dispatch:

jobs:
  multichannel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        stream: [adversarial_k2, adversarial_k3, aligned_split, admissibility_k3, null_k2]
        shard: ['0','1','2','3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy
      - name: Run frozen G30 lane
        run: |
          mkdir -p out
          python scripts/iter012_multichannel_comparator.py --stream '${{ matrix.stream }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg012-${{ matrix.stream }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    if: always()
    needs: multichannel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate G30
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          by={}
          for r in rows:
              x=by.setdefault(r['stream'],{'n':0,'structural_valid':0,'scientific_support':0})
              x['n']+=1; x['structural_valid']+=int(r['structural_valid']); x['scientific_support']+=int(r['result']['scientific_support'])
          k2=[r['result']['best_gap'] for r in rows if r['stream']=='adversarial_k2']
          k3=[r['result']['best_gap'] for r in rows if r['stream']=='adversarial_k3']
          s={'iteration':'Iter012','gate':'G30','n_results':len(rows),'streams':by,
             'all_structural_valid':len(rows)==20 and all(r['structural_valid'] for r in rows),
             'min_k2_adversarial_gap':min(k2) if k2 else None,
             'min_k3_adversarial_gap':min(k3) if k3 else None,
             'all_scientific_support':len(rows)==20 and all(r['result']['scientific_support'] for r in rows),
             'scope_lock':'Additive K<=3 finite two-qubit Markovian independent-channel GKSL comparator only.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(s,indent=2)); print(json.dumps(s,indent=2))
          if not s['all_structural_valid']: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg012-summary
          path: summary/summary.json
