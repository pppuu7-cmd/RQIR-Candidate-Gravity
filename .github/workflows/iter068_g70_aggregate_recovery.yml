name: RCG Iter068 G70 aggregate recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter068_g70_aggregate_recovery.yml'
  workflow_dispatch:

jobs:
  aggregate-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install aggregate dependency only
        run: python -m pip install --upgrade pip sympy
      - name: Download already-valid G70 stream artifacts from authoritative run
        uses: actions/download-artifact@v4
        with:
          pattern: g70-*
          path: downloaded
          merge-multiple: false
          run-id: 34772158456
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Frozen aggregate only
        run: |
          mkdir -p out
          python scripts/iter068_g70_beyond_baseline_architecture_triage.py --aggregate-dir downloaded --out out/g70_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g70-aggregate-recovery
          path: out/g70_aggregate.json
          if-no-files-found: error
