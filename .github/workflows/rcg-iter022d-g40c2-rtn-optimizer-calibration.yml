name: RCG Iter022D G40-C2 RTN Optimizer Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER022D_G40C2_RTN_OPTIMIZER_CALIBRATION_LAUNCH.md'

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G40-C2 calibration lane
        run: |
          mkdir -p out
          python scripts/iter022d_g40c2_rtn_optimizer_calibration.py --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg022d-g40c2-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: calibrate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G40-C2 rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          methods=('sobol_lsq','lhs_lsq')
          structural=bool(len(rows)==8 and all(r['structural_valid'] for r in rows))
          by={}
          for m in methods:
              rr=[r for r in rows if r['method']==m]
              by[m]={'n':len(rr),'support_count':sum(int(r['scientific_support']) for r in rr),'worst_max_trace_gap':max((r['best_max_trace_gap'] for r in rr),default=None),'min_recovered_BLP':min((r['recovered_BLP_total_positive_increment'] for r in rr),default=None),'all_support':bool(len(rr)==4 and all(r['scientific_support'] for r in rr))}
          support=bool(structural and all(by[m]['all_support'] for m in methods))
          summary={'iteration':'Iter022D','gate':'G40-C2','n_results':len(rows),'all_structural_valid':structural,'by_method':by,'scientific_support':support,
                   'frozen_recovery_tolerance':0.002,'frozen_BLP_min':0.02,
                   'interpretation':'Corrected positive-control optimizer calibration only. PASS authorizes a separate prospective RCG-002 adversarial strict-BLP RTN gate.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg022d-g40c2-summary
          path: summary/summary.json
