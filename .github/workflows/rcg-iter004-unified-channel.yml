name: RCG Iter004 Unified Coherent-Noise Channel

on:
  push:
    branches: [main]
    paths:
      - 'scripts/iter004_unified_channel.py'
      - '.github/workflows/rcg-iter004-unified-channel.yml'
  workflow_dispatch:

jobs:
  gate-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {gate: cptp, arg: '0.001:-0.6', label: cptp-g001-rm06}
          - {gate: cptp, arg: '0.001:0.0', label: cptp-g001-r00}
          - {gate: cptp, arg: '0.001:0.6', label: cptp-g001-r06}
          - {gate: cptp, arg: '0.05:-0.6', label: cptp-g05-rm06}
          - {gate: cptp, arg: '0.05:0.0', label: cptp-g05-r00}
          - {gate: cptp, arg: '0.05:0.6', label: cptp-g05-r06}
          - {gate: coherent_limit, arg: '0.5', label: coherent-s05}
          - {gate: coherent_limit, arg: '1.0', label: coherent-s10}
          - {gate: coherent_limit, arg: '2.0', label: coherent-s20}
          - {gate: noise_limit, arg: '0.001:-0.6', label: noise-g001-rm06}
          - {gate: noise_limit, arg: '0.01:0.0', label: noise-g01-r00}
          - {gate: noise_limit, arg: '0.05:0.6', label: noise-g05-r06}
          - {gate: no_double_count, arg: '0.001:-0.6', label: compose-g001-rm06}
          - {gate: no_double_count, arg: '0.01:0.0', label: compose-g01-r00}
          - {gate: no_double_count, arg: '0.05:0.6', label: compose-g05-r06}
          - {gate: robustness, arg: '0.0001', label: robust-g0001}
          - {gate: robustness, arg: '0.001', label: robust-g001}
          - {gate: robustness, arg: '0.01', label: robust-g01}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy
      - name: Run preregistered unified-channel gate
        run: |
          mkdir -p out
          python scripts/iter004_unified_channel.py --gate '${{ matrix.gate }}' --arg '${{ matrix.arg }}' --out 'out/${{ matrix.label }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: rcg004-${{ matrix.label }}
          path: out/${{ matrix.label }}.json

  aggregate:
    if: always()
    needs: gate-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rcg004-*
          path: artifacts
      - name: Aggregate preregistered outcomes
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          groups={}
          for r in rows:
              g=r['gate']; groups.setdefault(g,{'n':0,'passes':0})
              groups[g]['n']+=1; groups[g]['passes']+=int(bool(r['pass']))
          for v in groups.values(): v['all_pass']=v['n']==v['passes']
          s={'candidate':'RCG-003-unified','iteration':'ITER004','n_results':len(rows),'gates':groups,'all_hard_pass':len(rows)==18 and all(r['pass'] for r in rows)}
          os.makedirs('summary',exist_ok=True)
          with open('summary/summary.json','w') as f: json.dump(s,f,indent=2)
          print(json.dumps(s,indent=2))
          if not s['all_hard_pass']: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg004-iter004-summary
          path: summary/summary.json
