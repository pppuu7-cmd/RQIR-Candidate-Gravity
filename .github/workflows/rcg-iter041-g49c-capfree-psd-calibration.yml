name: RCG Iter041 G49-C Capfree PSD Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER041_G49C_LAUNCH.md'

jobs:
  calibration:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        method: [sobol_lsq, lhs_lsq]
        rank: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G49-C calibration lane
        run: |
          mkdir -p out
          python scripts/iter041_g49c_capfree_psd_calibration.py --method '${{ matrix.method }}' --rank '${{ matrix.rank }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg041-g49c-${{ matrix.method }}-r${{ matrix.rank }}
          path: out/result.json

  aggregate:
    needs: calibration
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G49-C rules
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==12 and all(r.get('structural_valid',False) for r in rows))
          pairs=[]
          for rank in range(1,7):
              rr=[r for r in rows if r.get('rank')==rank]
              gaps=sorted([r['best_candidate']['gap'] for r in rr])
              ok=bool(len(rr)==2 and all(r.get('scientific_support',False) for r in rr) and abs(gaps[1]-gaps[0])<=0.002)
              pairs.append({'rank':rank,'gaps':gaps,'difference':abs(gaps[1]-gaps[0]) if len(gaps)==2 else None,'pair_support':ok})
          support=bool(structural and all(p['pair_support'] for p in pairs))
          cls='CAPFREE_DIRECT_PSD_OPTIMIZER_CALIBRATED' if support else ('G49C_IMPLEMENTATION_OR_NUMERICAL_INVALID' if not structural else 'G49C_FROZEN_CALIBRATION_RULE_NOT_MET')
          summary={'iteration':'Iter041','gate':'G49-C','n_results':len(rows),'all_structural_valid':structural,'pairs':pairs,'scientific_support':support,'classification':cls,'scope_lock':'Response-blind direct-PSD optimizer calibration only; no unbounded-PSD theorem.','interpretation':'PASS only authorizes a later prospectively frozen RCG-002 transport.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg041-g49c-summary
          path: summary/summary.json
