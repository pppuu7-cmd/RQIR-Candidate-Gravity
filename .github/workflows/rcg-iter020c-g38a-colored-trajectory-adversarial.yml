name: RCG Iter020C G38-A Colored Trajectory Adversarial

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER020C_G38A_LAUNCH.md'

jobs:
  adversarial:
    strategy:
      fail-fast: false
      matrix:
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G38-A trajectory adversarial lane
        run: |
          mkdir -p out
          python scripts/iter020c_g38a_colored_trajectory_adversarial.py --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg020c-g38a-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: adversarial
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G38-A trajectory rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          methods=('sobol_lsq','lhs_lsq'); nz=1e-4; agree=0.002
          structural=bool(len(rows)==8 and all(r['structural_valid'] for r in rows))
          shards={}
          for s in range(4):
              rr={r['method']:r for r in rows if r['shard']==s}
              vec={m:rr[m]['result']['per_time_trace_gaps'] for m in methods if m in rr}
              mx={m:rr[m]['result']['max_trace_gap'] for m in methods if m in rr}
              both_nonzero=bool(len(mx)==2 and all(v>nz for v in mx.values()))
              per_time_agreement=bool(len(vec)==2 and max(abs(a-b) for a,b in zip(vec['sobol_lsq'],vec['lhs_lsq']))<=agree)
              max_agreement=bool(len(mx)==2 and abs(mx['sobol_lsq']-mx['lhs_lsq'])<=agree)
              shards[str(s)]={'per_time_gaps':vec,'max_gaps':mx,'both_nonzero':both_nonzero,'per_time_cross_method_agreement':per_time_agreement,'max_cross_method_agreement':max_agreement,'scientific_support':bool(both_nonzero and per_time_agreement and max_agreement)}
          support=bool(structural and all(v['scientific_support'] for v in shards.values()))
          summary={'iteration':'Iter020C','gate':'G38-A','n_results':len(rows),'all_structural_valid':structural,'per_shard':shards,'scientific_support':support,'frozen_rules':{'trajectory_nonzero_max_gap':nz,'cross_method_per_time_agreement':agree,'cross_method_max_agreement':agree},'times':[0.25,0.5,1.0],'target_convention':'Toy RCG-002 target(theta*T), not full continuum gravity-time dynamics.','interpretation':'Support, if any, is restricted to the calibrated finite three-time OU colored classical-noise trajectory family.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg020c-g38a-summary
          path: summary/summary.json
