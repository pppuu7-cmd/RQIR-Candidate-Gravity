name: RCG Iter038 G46-A Extended Trace-Ball Adversarial

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER038_G46A_LAUNCH.md'

jobs:
  adversarial:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cap: [8, 16]
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G46-A adversarial lane
        run: |
          mkdir -p out
          python scripts/iter038_g46a_extended_trace_ball_adversarial.py --cap '${{ matrix.cap }}' --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg038-g46a-cap${{ matrix.cap }}-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: adversarial
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G46-A pair and nesting rules
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==16 and all(r['structural_valid'] for r in rows))
          pairs=[]
          for cap in (8.0,16.0):
              for s in range(4):
                  rr=[r for r in rows if float(r['trace_cap'])==cap and r['shard']==s]
                  gaps=sorted([r['best_candidate']['gap'] for r in rr])
                  ok=bool(len(rr)==2 and all(r['admissible'] and r['lane_support'] for r in rr) and abs(gaps[1]-gaps[0])<=0.002)
                  pairs.append({'cap':cap,'shard':s,'gaps':gaps,'difference':abs(gaps[1]-gaps[0]) if len(gaps)==2 else None,'pair_support':ok})
          nesting=[]
          for s in range(4):
              g8=[r['best_candidate']['gap'] for r in rows if float(r['trace_cap'])==8.0 and r['shard']==s]
              g16=[r['best_candidate']['gap'] for r in rows if float(r['trace_cap'])==16.0 and r['shard']==s]
              b8=min(g8) if g8 else None; b16=min(g16) if g16 else None
              ok=bool(b8 is not None and b16 is not None and b16<=b8+0.002)
              nesting.append({'shard':s,'best_cap8':b8,'best_cap16':b16,'nested_support':ok})
          support=bool(structural and all(p['pair_support'] for p in pairs) and all(n['nested_support'] for n in nesting))
          summary={'iteration':'Iter038','gate':'G46-A','n_results':len(rows),'all_structural_valid':structural,'pairs':pairs,'nesting':nesting,'scientific_support':support,'classification':'DERIVED_SCOPED_EXTENDED_TRACE_BALL_PSD_COMPARATOR_SUPPORT_CAP8_CAP16' if support else 'G46A_FROZEN_SUPPORT_RULE_NOT_MET','scope_lock':'Bounded basis-invariant real-PSD Markovian trace caps 8 and 16 only.','interpretation':'Scoped toy-trajectory comparator result; not unbounded PSD or all-classical no-go.'}
          os.makedirs('summary',exist_ok=True)
          open('summary/summary.json','w').write(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg038-g46a-summary
          path: summary/summary.json
