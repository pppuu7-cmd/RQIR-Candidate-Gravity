name: RCG Iter067 G69 candidate-owned novelty prerequisite audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/iter067_g69_candidate_owned_novelty_prerequisite.py'
      - '.github/workflows/rcg-iter067-g69-candidate-owned-novelty-prerequisite.yml'
  workflow_dispatch:

jobs:
  stream:
    strategy:
      fail-fast: false
      matrix:
        stream: [A, B, C, D, E]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/iter067_g69_candidate_owned_novelty_prerequisite.py --stream ${{ matrix.stream }} --out out/${{ matrix.stream }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g69-${{ matrix.stream }}
          path: out/${{ matrix.stream }}.json

  aggregate:
    needs: stream
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g69-*
          path: downloaded
      - run: find downloaded -maxdepth 3 -type f -print
      - run: python scripts/iter067_g69_candidate_owned_novelty_prerequisite.py --aggregate-dir downloaded --out summary/g69_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: g69-aggregate
          path: summary/g69_summary.json
