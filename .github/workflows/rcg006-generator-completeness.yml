name: RCG006 generator completeness pre-map
on:
  push:
    paths:
      - '.github/workflows/rcg006-generator-completeness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  constructor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install sympy==1.13.3
      - name: Verify prospective chronology
        run: |
          git merge-base --is-ancestor dc955720822d353d446186437ee2ca69458633bd "$GITHUB_SHA"
          git merge-base --is-ancestor fc3ff1f49c56f2befc039e09ebd8f388833dbff1 "$GITHUB_SHA"
          git merge-base --is-ancestor 43748579a78f40e0825d5ae01dc634d55ba7b928 "$GITHUB_SHA"
      - run: python scripts/rcg006_generator_constructor.py --output rcg006-generator-constructor.json --run-head "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with: {name: rcg006-generator-constructor, path: rcg006-generator-constructor.json}
  critic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install sympy==1.13.3
      - name: Verify independent Critic chronology
        run: |
          git merge-base --is-ancestor dc955720822d353d446186437ee2ca69458633bd "$GITHUB_SHA"
          git merge-base --is-ancestor fc3ff1f49c56f2befc039e09ebd8f388833dbff1 "$GITHUB_SHA"
          git merge-base --is-ancestor 43748579a78f40e0825d5ae01dc634d55ba7b928 "$GITHUB_SHA"
      - run: python scripts/rcg006_generator_critic.py --output rcg006-generator-critic.json --run-head "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with: {name: rcg006-generator-critic, path: rcg006-generator-critic.json}
  aggregate:
    needs: [constructor, critic]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: rcg006-generator-constructor, path: ctor}
      - uses: actions/download-artifact@v4
        with: {name: rcg006-generator-critic, path: crit}
      - run: python scripts/rcg006_generator_aggregate.py --constructor ctor/rcg006-generator-constructor.json --critic crit/rcg006-generator-critic.json --output rcg006-generator-aggregate.json --run-head "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with: {name: rcg006-generator-aggregate, path: rcg006-generator-aggregate.json}
