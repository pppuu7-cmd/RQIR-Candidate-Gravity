name: RCG Iter031 G40-TM-A Trace-Metric RTN Adversarial

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER031_G40TMA_LAUNCH.md'

jobs:
  adversarial:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        method: [sobol_powell, lhs_powell]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G40-TM-A adversarial lane
        run: |
          mkdir -p out
          python scripts/iter031_g40tma_trace_metric_rtn_adversarial.py --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg031-g40tma-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: adversarial
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G40-TM-A rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==8 and all(r['structural_valid'] for r in rows))
          by_shard={}; support=structural
          for s in range(4):
              rr=[r for r in rows if r['shard']==s]
              methods={r['method']:r for r in rr}
              gaps=[methods[m]['best_strict_candidate']['gap'] for m in ('sobol_powell','lhs_powell') if m in methods and methods[m]['best_strict_candidate'] is not None]
              blps=[methods[m]['best_strict_candidate']['axis_covariant_BLP'] for m in ('sobol_powell','lhs_powell') if m in methods and methods[m]['best_strict_candidate'] is not None]
              diff=abs(gaps[0]-gaps[1]) if len(gaps)==2 else None
              pair=bool(len(rr)==2 and all(r['lane_support'] for r in rr) and diff is not None and diff<=0.002)
              support=bool(support and pair)
              by_shard[str(s)]={'n':len(rr),'lane_support_count':sum(int(r['lane_support']) for r in rr),'best_gaps':gaps,'min_BLP':min(blps) if blps else None,'cross_method_gap_difference':diff,'pair_support':pair}
          classification='DERIVED_SCOPED_TRACE_METRIC_RTN_COMPARATOR_SUPPORT' if support else ('G40TMA_FROZEN_SUPPORT_RULE_NOT_MET' if structural else 'STRUCTURAL_NUMERICAL_FAIL')
          summary={'iteration':'Iter031','gate':'G40-TM-A','n_results':len(rows),'all_structural_valid':structural,'scientific_support':support,'by_shard':by_shard,'classification':classification,
                   'authorization_lock':'This run is scientifically authorized only if terminal G40-TM-C PASS predates the launch marker.',
                   'scope_lock':'Finite hidden-classical symmetric RTN family with candidate-axis-frame covariant BLP witness; no universal non-Markovian/classical claim.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg031-g40tma-summary
          path: summary/summary.json
