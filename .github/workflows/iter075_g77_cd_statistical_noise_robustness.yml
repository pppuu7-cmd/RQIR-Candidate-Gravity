name: RCG Iter075 G77 C-D statistical-noise robustness
on:
  push:
    branches: [g77-statistical-noise-robustness]
    paths:
      - 'scripts/iter075_g77_cd_statistical_noise_robustness.py'
      - 'prereg/ITER075_G77_CD_STATISTICAL_NOISE_ROBUSTNESS.md'
      - '.github/workflows/iter075_g77_cd_statistical_noise_robustness.yml'
  workflow_dispatch:

jobs:
  lane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy
      - name: Run frozen scientific stream
        run: python scripts/iter075_g77_cd_statistical_noise_robustness.py --lane ${{ matrix.lane }} --out g77-${{ matrix.lane }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g77-${{ matrix.lane }}
          path: g77-${{ matrix.lane }}.json

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g77-*
          path: raw
          merge-multiple: true
      - name: Apply frozen aggregate
        shell: python
        run: |
          import json, pathlib, sys
          expected={
            'A':'ANALYTIC_ESTIMATOR_VARIANCE_WEAK_ANCHOR_AMPLIFICATION_SCOPED',
            'B':'GAUSSIAN_COVARIANCE_SIGMA2_SCALING_SCOPED',
            'C':'FIXED_SEED_MONTE_CARLO_COVARIANCE_REPLICATION_SCOPED',
            'D':'ORTHOGONAL_PARAMETER_COVARIANCE_AND_ONE_SIDED_CONTROL_SCOPED'}
          rows={}
          for p in pathlib.Path('raw').glob('g77-*.json'):
            r=json.loads(p.read_text()); rows[r['stream']]=r
          valid=(set(rows)==set(expected) and all(rows[k].get('valid') and rows[k].get('classification')==v for k,v in expected.items()))
          out={'valid':valid,'lane_classifications':{k:rows[k]['classification'] for k in sorted(rows)},'classification':'G75_ANCHORED_ESTIMATOR_VARIANCE_GROWS_AS_ANCHORS_WEAKEN_SCOPED' if valid else 'INFRASTRUCTURE_OR_GATE_INVALID','readiness':66,'theory_established':0,'scope_lock':'Frozen G75 linear design plus iid Gaussian surrogate only; no physical detectability claim.'}
          pathlib.Path('g77-aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          if not valid: sys.exit(2)
      - uses: actions/upload-artifact@v4
        with:
          name: g77-aggregate
          path: g77-aggregate.json
