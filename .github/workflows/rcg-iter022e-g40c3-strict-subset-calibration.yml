name: RCG Iter022E G40-C3 Strict-BLP Search Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER022E_G40C3_STRICT_SUBSET_CALIBRATION_LAUNCH.md'

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G40-C3 strict-subset lane
        run: |
          mkdir -p out
          python scripts/iter022e_g40c3_strict_subset_search_calibration.py --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg022e-g40c3-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: calibrate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G40-C3 rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          methods=('sobol_lsq','lhs_lsq')
          structural=bool(len(rows)==8 and all(r['structural_valid'] for r in rows))
          by={}
          for m in methods:
              rr=[r for r in rows if r['method']==m]
              good=[r for r in rr if r['best_strict_candidate'] is not None]
              by[m]={'n':len(rr),'support_count':sum(int(r['scientific_support']) for r in rr),'worst_strict_gap':max((r['best_strict_candidate']['gap'] for r in good),default=None),'min_strict_BLP':min((r['best_strict_candidate']['BLP'] for r in good),default=None),'min_strict_candidate_count':min((r['n_strict_candidates'] for r in rr),default=0),'all_support':bool(len(rr)==4 and all(r['scientific_support'] for r in rr))}
          support=bool(structural and all(by[m]['all_support'] for m in methods))
          summary={'iteration':'Iter022E','gate':'G40-C3','n_results':len(rows),'all_structural_valid':structural,'by_method':by,'scientific_support':support,'frozen_recovery_tolerance':0.002,'frozen_strict_BLP_filter':0.02,'interpretation':'Calibration of the fixed-witness strict-BLP filtered search only. PASS authorizes a separate prospective RCG-002 adversarial gate with the same filter.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg022e-g40c3-summary
          path: summary/summary.json
