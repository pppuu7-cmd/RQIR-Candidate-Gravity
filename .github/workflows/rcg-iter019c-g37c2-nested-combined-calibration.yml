name: RCG Iter019C G37-C2 Nested Combined Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER019C_G37C2_LAUNCH.md'

jobs:
  positive:
    strategy:
      fail-fast: false
      matrix:
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G37-C2 positive-control lane
        run: |
          mkdir -p out
          python scripts/iter019c_g37c2_nested_combined_calibration.py --stream positive_control --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg019c-g37c2-positive-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  admissibility:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G37-C2 admissibility lane
        run: |
          mkdir -p out
          python scripts/iter019c_g37c2_nested_combined_calibration.py --stream admissibility --method none --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg019c-g37c2-admissibility-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: [positive, admissibility]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G37-C2 rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          methods=('sobol_lsq','lhs_lsq'); tol=0.002
          structural=bool(len(rows)==20 and all(r['structural_valid'] for r in rows))
          pos=[r for r in rows if r['stream']=='positive_control']; adm=[r for r in rows if r['stream']=='admissibility']
          bm={}
          for m in methods:
              rr=[r for r in pos if r['method']==m]
              bm[m]={'n':len(rr),'support_count':sum(int(r['result']['scientific_support']) for r in rr),'worst_trace_gap':max((r['result']['best_trace_gap'] for r in rr),default=None),'all_support':bool(len(rr)==8 and all(r['result']['scientific_support'] for r in rr))}
          boundary={}
          for s in (4,5):
              rr={r['method']:r for r in pos if r['shard']==s}; boundary[str(s)]={m:rr[m]['result']['best_trace_gap'] for m in methods if m in rr}
          adm_ok=bool(len(adm)==4 and all(r['result']['scientific_support'] for r in adm))
          support=bool(structural and adm_ok and all(bm[m]['all_support'] for m in methods))
          s={'iteration':'Iter019C','gate':'G37-C2','n_results':len(rows),'all_structural_valid':structural,'by_method':bm,'boundary_recovery':boundary,'admissibility':{'n':len(adm),'all_support':adm_ok},'scientific_support':support,'frozen_recovery_tolerance':tol,'interpretation':'Calibration of corrected truly nested combined family. PASS only authorizes a separate adversarial gate.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(s,indent=2)); print(json.dumps(s,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg019c-g37c2-summary
          path: summary/summary.json
