name: RCG Iter088 G90 C covariant cubic lift
on:
  push:
    branches: [g90-c-covariant-cubic-lift]
    paths:
      - 'scripts/iter088_g90_c_covariant_cubic_lift.py'
      - 'prereg/ITER088_G90_C_COVARIANT_CUBIC_LIFT.md'
      - '.github/workflows/iter088_g90_c_covariant_cubic_lift.yml'
  workflow_dispatch:

jobs:
  lane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip sympy
      - name: Run frozen scientific stream
        run: python scripts/iter088_g90_c_covariant_cubic_lift.py --lane ${{ matrix.lane }} --out g90-${{ matrix.lane }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g90-${{ matrix.lane }}
          path: g90-${{ matrix.lane }}.json

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g90-*
          path: raw
          merge-multiple: true
      - name: Apply frozen aggregate
        shell: python
        run: |
          import json, pathlib, sys
          expected={
            'A':'C_COVARIANT_CUBIC_DENSITIES_START_AT_THIRD_ORDER_SCOPED',
            'B':'C_COVARIANT_CUBIC_INVARIANTS_POINTWISE_INDEPENDENT_SCOPED',
            'C':'C_COVARIANT_CUBIC_CTP_FAMILY_PRESERVES_LOWER_DATA_SCOPED',
            'D':'C_COVARIANT_LIFT_ORDER_AND_INDEPENDENCE_CONTROLS_SCOPED'}
          rows={}
          for p in pathlib.Path('raw').glob('g90-*.json'):
            r=json.loads(p.read_text()); rows[r['stream']]=r
          valid=(set(rows)==set(expected) and all(rows[k].get('valid') and rows[k].get('classification')==v for k,v in expected.items()))
          out={'valid':valid,'lane_classifications':{k:rows[k]['classification'] for k in sorted(rows)},'classification':'BLOCKED_C_EXPLICIT_COVARIANT_CUBIC_INVARIANT_FAMILY_PRESERVES_FROZEN_QUADRATIC_DATA_SCOPED' if valid else 'INFRASTRUCTURE_OR_GATE_INVALID','scientific_status':'BLOCKED_COVARIANT_FAMILY_UNDERDETERMINED_SCOPED' if valid else 'INVALID','readiness':66,'theory_established':0,'scope_lock':'Explicit two-invariant local covariant family only; no completeness modulo field redefinitions/boundaries, causal/unitary/measure closure, or physical completion selection.'}
          pathlib.Path('g90-aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          if not valid: sys.exit(2)
      - uses: actions/upload-artifact@v4
        with:
          name: g90-aggregate
          path: g90-aggregate.json
