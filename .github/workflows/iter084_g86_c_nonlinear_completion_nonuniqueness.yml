name: RCG Iter084 G86 C nonlinear completion nonuniqueness
on:
  push:
    branches: [g86-c-nonlinear-completion-nonuniqueness]
    paths:
      - 'scripts/iter084_g86_c_nonlinear_completion_nonuniqueness.py'
      - 'prereg/ITER084_G86_C_NONLINEAR_COMPLETION_NONUNIQUENESS.md'
      - '.github/workflows/iter084_g86_c_nonlinear_completion_nonuniqueness.yml'
  workflow_dispatch:

jobs:
  lane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip sympy
      - name: Run frozen scientific stream
        run: python scripts/iter084_g86_c_nonlinear_completion_nonuniqueness.py --lane ${{ matrix.lane }} --out g86-${{ matrix.lane }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g86-${{ matrix.lane }}
          path: g86-${{ matrix.lane }}.json

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g86-*
          path: raw
          merge-multiple: true
      - name: Apply frozen aggregate
        shell: python
        run: |
          import json, pathlib, sys
          expected={
            'A':'C_CUBIC_ADDITIONS_PRESERVE_FROZEN_QUADRATIC_JET_SCOPED',
            'B':'C_DISTINCT_CUBIC_JET_SHAPES_LINEAR_COORDINATE_ROBUST_SCOPED',
            'C':'C_CUBIC_CTP_NORMALIZATION_BRANCH_STRUCTURE_SCOPED',
            'D':'C_NONLINEAR_NONUNIQUENESS_ADVERSARIAL_CONTROLS_SCOPED'}
          rows={}
          for p in pathlib.Path('raw').glob('g86-*.json'):
            r=json.loads(p.read_text()); rows[r['stream']]=r
          valid=(set(rows)==set(expected) and all(rows[k].get('valid') and rows[k].get('classification')==v for k,v in expected.items()))
          out={'valid':valid,'lane_classifications':{k:rows[k]['classification'] for k in sorted(rows)},'classification':'BLOCKED_C_FROZEN_QUADRATIC_DATA_ADMIT_MULTIPLE_CUBIC_CTP_COMPLETIONS_SCOPED' if valid else 'INFRASTRUCTURE_OR_GATE_INVALID','scientific_status':'BLOCKED_UNDERDETERMINED_SCOPED' if valid else 'INVALID','readiness':66,'theory_established':0,'scope_lock':'Finite lower-jet nonuniqueness witness only; no complete nonlinear C law, arbitrary-field-redefinition inequivalence, causal/unitary/measure closure, or physical completion selected.'}
          pathlib.Path('g86-aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          if not valid: sys.exit(2)
      - uses: actions/upload-artifact@v4
        with:
          name: g86-aggregate
          path: g86-aggregate.json
