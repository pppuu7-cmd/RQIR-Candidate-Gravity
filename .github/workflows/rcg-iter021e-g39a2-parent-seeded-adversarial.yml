name: RCG Iter021E G39-A2 Parent-Seeded Adversarial

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER021E_G39A2_PARENT_SEEDED_ADVERSARIAL_LAUNCH.md'

jobs:
  adversarial:
    strategy:
      fail-fast: false
      matrix:
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen repaired G39-A2 lane
        run: |
          mkdir -p out
          python scripts/iter021e_g39a2_parent_seeded_adversarial.py --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg021e-g39a2-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: adversarial
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G39-A2 rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          methods=('sobol_lsq','lhs_lsq'); nz=1e-4; agree=0.002; nest=1e-10
          structural=bool(len(rows)==8 and all(r['structural_valid'] for r in rows))
          shards={}
          for s in range(4):
              rr={r['method']:r for r in rows if r['shard']==s}
              gaps={m:rr[m]['rank3_repaired_best']['gap'] for m in methods if m in rr}
              parents={m:rr[m]['rank2_parent']['gap'] for m in methods if m in rr}
              embed=bool(len(rr)==2 and all(rr[m]['checks']['exact_embedding_agrees_parent_1e-10'] for m in methods))
              nesting=bool(len(rr)==2 and all(rr[m]['checks']['rank3_not_worse_than_parent_1e-10'] for m in methods))
              nonzero=bool(len(gaps)==2 and all(v>nz for v in gaps.values()))
              cross=bool(len(gaps)==2 and abs(gaps['sobol_lsq']-gaps['lhs_lsq'])<=agree)
              parent_cross=bool(len(parents)==2 and abs(parents['sobol_lsq']-parents['lhs_lsq'])<=agree)
              support=bool(embed and nesting and nonzero and cross and parent_cross)
              shards[str(s)]={'rank3_gaps':gaps,'rank2_parent_gaps':parents,'exact_embedding_ok':embed,'nesting_ok':nesting,'both_nonzero':nonzero,'rank3_cross_method_agreement':cross,'parent_cross_method_agreement':parent_cross,'scientific_support':support}
          support=bool(structural and all(v['scientific_support'] for v in shards.values()))
          summary={'iteration':'Iter021E','gate':'G39-A2','n_results':len(rows),'all_structural_valid':structural,'per_shard':shards,'scientific_support':support,
                   'frozen_rules':{'nonzero_gap':nz,'cross_method_agreement':agree,'exact_embedding_and_nesting_tolerance':nest},
                   'interpretation':'Support, if any, is restricted to the calibrated finite rank-3 multimode shared classical white-noise family. Parent-boundary seeding repairs the diagnosed search miss without changing the family.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg021e-g39a2-summary
          path: summary/summary.json
