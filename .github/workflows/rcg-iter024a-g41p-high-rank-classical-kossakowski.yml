name: RCG Iter024A G41-P High Rank Classical Kossakowski

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER024A_G41P_LAUNCH.md'

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        rank: [4, 5, 6]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G41-P implementation lane
        run: |
          mkdir -p out
          python scripts/iter024a_g41p_high_rank_classical_kossakowski.py --rank '${{ matrix.rank }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg024a-g41p-r${{ matrix.rank }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G41-P rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==12 and all(r['structural_valid'] for r in rows))
          by={}
          for rank in (4,5,6):
              rr=[r for r in rows if r['rank']==rank]
              by[str(rank)]={'n':len(rr),'support_count':sum(int(r['scientific_support']) for r in rr),
                             'min_kossakowski_eigenvalue':min((r['kossakowski']['min_eigenvalue'] for r in rr),default=None),
                             'max_tp_residual':max((r['admissibility']['max_tp_residual'] for r in rr),default=None),
                             'min_choi_eigenvalue':min((r['admissibility']['min_choi_eigenvalue'] for r in rr),default=None),
                             'max_factorization_error':max((r['admissibility']['product_unitary_factorization_error'] for r in rr),default=None),
                             'max_output_negativity':max((r['admissibility']['max_product_input_output_negativity'] for r in rr),default=None),
                             'all_support':bool(len(rr)==4 and all(r['scientific_support'] for r in rr))}
          support=bool(structural and all(by[str(r)]['all_support'] for r in (4,5,6)))
          summary={'iteration':'Iter024A','gate':'G41-P','n_results':len(rows),'all_structural_valid':structural,'by_rank':by,'scientific_support':support,
                   'classification':'HIGH_RANK_CLASSICAL_KOSSAKOWSKI_IMPLEMENTATION_VALIDATED' if support else 'HIGH_RANK_CLASSICAL_KOSSAKOWSKI_PRE_GATE_NOT_CLOSED',
                   'interpretation':'Implementation/provenance only; no RCG-002 target and no readiness increase by itself.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg024a-g41p-summary
          path: summary/summary.json
