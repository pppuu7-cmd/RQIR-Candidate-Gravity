name: RCG Iter094 G96 G95 structural obstruction attribution

on:
  push:
    branches: [ main ]
    paths:
      - 'prereg/ITER094_G96_G95_CONSTRAINT_ATTRIBUTION.md'
      - 'scripts/iter094_g96_g95_constraint_attribution.py'
      - '.github/workflows/iter094_g96_g95_constraint_attribution.yml'
  workflow_dispatch:

jobs:
  lanes:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'sympy==1.13.3'
      - run: |
          mkdir -p out
          python scripts/iter094_g96_g95_constraint_attribution.py --lane "${{ matrix.lane }}" --out "out/g96_${{ matrix.lane }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: g96-lane-${{ matrix.lane }}
          path: out/g96_${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lanes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'sympy==1.13.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: g96-lane-*
          path: raw
          merge-multiple: true
      - run: python scripts/iter094_g96_g95_constraint_attribution.py --aggregate raw/g96_A.json raw/g96_B.json raw/g96_C.json raw/g96_D.json --out g96_aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: g96-aggregate
          path: g96_aggregate.json
          if-no-files-found: error
          retention-days: 90
