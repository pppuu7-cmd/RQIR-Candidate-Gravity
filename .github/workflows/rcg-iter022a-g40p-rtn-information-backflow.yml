name: RCG Iter022A G40-P RTN Information Backflow

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER022A_G40P_RTN_INFORMATION_BACKFLOW_LAUNCH.md'

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G40-P RTN witness lane
        run: |
          mkdir -p out
          python scripts/iter022a_g40p_rtn_information_backflow_validation.py --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg022a-g40p-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G40-P rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==4 and all(r['structural_valid'] for r in rows))
          support=bool(structural and all(r['scientific_support'] for r in rows))
          summary={'iteration':'Iter022A','gate':'G40-P','n_results':len(rows),'all_structural_valid':structural,'scientific_support':support,
                   'min_strong_BLP':min((r['strong_control']['blp_total_positive_increment'] for r in rows),default=None),
                   'max_weak_BLP':max((r['weak_control']['blp_total_positive_increment'] for r in rows),default=None),
                   'max_tp_error':max((r['admissibility']['max_tp_error'] for r in rows),default=None),
                   'min_choi_eig':min((r['admissibility']['min_choi_eig'] for r in rows),default=None),
                   'max_factorization_error':max((r['admissibility']['max_product_unitary_factorization_error'] for r in rows),default=None),
                   'max_product_input_negativity':max((r['admissibility']['max_product_input_output_negativity'] for r in rows),default=None),
                   'interpretation':'Implementation/witness validation only for a strictly BLP-backflow-capable hidden classical RTN channel; no RCG-002 comparison.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg022a-g40p-summary
          path: summary/summary.json
