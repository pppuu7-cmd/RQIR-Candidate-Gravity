name: Same-realization orientation wave 35

on:
  push:
    branches: [same-realization-orientation-wave35]

permissions:
  contents: read

jobs:
  orientation-tests:
    strategy:
      fail-fast: false
      matrix:
        test:
          - availability_evidence_gate
          - lineage_coverage_graph
          - anti_splice_gate
          - orientation_sufficiency
          - fresh_recompute_contract
          - compute_budget
          - j8_j9_shape_contract
          - provenance_firewall
          - information_firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy
      - name: Run ${{ matrix.test }}
        run: python compute_wave35/${{ matrix.test }}.py
      - uses: actions/upload-artifact@v4
        with:
          name: wave35-${{ matrix.test }}
          path: wave35_${{ matrix.test }}.json

  aggregate-wave35:
    needs: orientation-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: wave35_downloads
      - run: python compute_wave35/aggregate_wave35.py
      - uses: actions/upload-artifact@v4
        with:
          name: same-realization-orientation-wave35-summary
          path: wave35_summary.json
