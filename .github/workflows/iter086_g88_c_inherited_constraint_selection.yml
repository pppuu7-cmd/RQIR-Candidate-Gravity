name: RCG Iter086 G88 C inherited constraint selection
on:
  push:
    branches: [g88-c-inherited-constraint-selection]
    paths:
      - 'scripts/iter086_g88_c_inherited_constraint_selection.py'
      - 'prereg/ITER086_G88_C_INHERITED_CONSTRAINT_SELECTION_SUFFICIENCY.md'
      - '.github/workflows/iter086_g88_c_inherited_constraint_selection.yml'
  workflow_dispatch:

jobs:
  lane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip sympy
      - name: Run frozen scientific stream
        run: python scripts/iter086_g88_c_inherited_constraint_selection.py --lane ${{ matrix.lane }} --out g88-${{ matrix.lane }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g88-${{ matrix.lane }}
          path: g88-${{ matrix.lane }}.json

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g88-*
          path: raw
          merge-multiple: true
      - name: Apply frozen aggregate
        shell: python
        run: |
          import json, pathlib, sys
          expected={
            'A':'C_INHERITED_LOWER_JET_SELECTION_RANK_ZERO_SCOPED',
            'B':'C_INHERITED_CTP_SELECTION_RANK_ZERO_SCOPED',
            'C':'C_FROZEN_QUADRATIC_WARD_SECTOR_COEFFICIENT_BLIND_SCOPED',
            'D':'C_HIGHER_ORDER_SELECTION_CONTROL_CALIBRATION_SCOPED'}
          rows={}
          for p in pathlib.Path('raw').glob('g88-*.json'):
            r=json.loads(p.read_text()); rows[r['stream']]=r
          valid=(set(rows)==set(expected) and all(rows[k].get('valid') and rows[k].get('classification')==v for k,v in expected.items()))
          out={'valid':valid,'lane_classifications':{k:rows[k]['classification'] for k in sorted(rows)},'classification':'BLOCKED_C_INHERITED_LOWER_WARD_CTP_CONSTRAINTS_DO_NOT_SELECT_CUBIC_COMPLETION_COEFFICIENTS_SCOPED' if valid else 'INFRASTRUCTURE_OR_GATE_INVALID','scientific_status':'BLOCKED_SELECTION_PRINCIPLE_MISSING_SCOPED' if valid else 'INVALID','readiness':66,'theory_established':0,'scope_lock':'Inherited-through-G86 selection sufficiency only; no claim that no deeper C principle exists or that the reduced witness basis is complete.'}
          pathlib.Path('g88-aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          if not valid: sys.exit(2)
      - uses: actions/upload-artifact@v4
        with:
          name: g88-aggregate
          path: g88-aggregate.json
