name: F1 public orientation audit wave 36
on:
  push:
    branches: [f1-public-orientation-audit-wave36]
    paths:
      - 'compute_wave36/**'
      - '.github/workflows/f1-public-orientation-audit-wave36.yml'

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validator-tests:
    strategy:
      fail-fast: false
      matrix:
        test:
          - audit_registry
          - valid_matrix_candidate
          - provenance_rejections
          - matrix_eigenbasis_consistency
          - complex_pair_realification
          - public_audit_no_promotion
          - information_firewall
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy
      - name: Run ${{ matrix.test }}
        run: cd compute_wave36 && python ${{ matrix.test }}.py
      - uses: actions/upload-artifact@v4
        with:
          name: wave36-${{ matrix.test }}
          path: compute_wave36/wave36_${{ matrix.test }}.json

  aggregate-wave36:
    needs: validator-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: wave36_downloads
      - run: python compute_wave36/aggregate_wave36.py
      - uses: actions/upload-artifact@v4
        with:
          name: f1-public-orientation-audit-wave36-summary
          path: wave36_summary.json
