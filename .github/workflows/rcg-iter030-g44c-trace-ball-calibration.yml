name: RCG Iter030 G44-C Trace-Ball PSD Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER030_G44C_LAUNCH.md'

jobs:
  calibrate:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        method: [sobol_lsq, lhs_lsq]
        rank: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G44-C positive-control lane
        run: |
          mkdir -p out
          python scripts/iter030_g44c_trace_ball_optimizer_calibration.py --method '${{ matrix.method }}' --rank '${{ matrix.rank }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg030-g44c-${{ matrix.method }}-r${{ matrix.rank }}
          path: out/result.json

  aggregate:
    needs: calibrate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G44-C rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==12 and all(r['structural_valid'] for r in rows))
          support=bool(structural and all(r['scientific_support'] for r in rows))
          by_rank={}
          for rank in range(1,7):
              rr=[r for r in rows if r['rank']==rank]
              gaps=[r['best_candidate']['gap'] for r in rr]
              crel=[r['best_candidate']['relative_kossakowski_error'] for r in rr]
              by_rank[str(rank)]={
                  'n':len(rr),'support_count':sum(int(r['scientific_support']) for r in rr),
                  'worst_gap':max(gaps) if gaps else None,
                  'worst_relative_C_error':max(crel) if crel else None,
                  'rank_match_count':sum(int(r['best_candidate']['recovered_effective_rank']==rank) for r in rr)
              }
          summary={'iteration':'Iter030','gate':'G44-C','n_results':len(rows),'all_structural_valid':structural,'scientific_support':support,'by_rank':by_rank,
                   'classification':'BASIS_INVARIANT_TRACE_BALL_PSD_OPTIMIZER_CALIBRATED' if support else 'TRACE_BALL_PSD_OPTIMIZER_CALIBRATION_NOT_ESTABLISHED',
                   'authorization_lock':'This run is scientifically authorized only if terminal G44-P PASS predates the launch marker.',
                   'scope_lock':'Bounded basis-invariant real-PSD trace-ball tr(C)<=4 optimizer calibration only; no RCG-002 target.',
                   'interpretation':'Calibration only; PASS may authorize a separate prospective adversarial gate and cannot raise readiness.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg030-g44c-summary
          path: summary/summary.json
