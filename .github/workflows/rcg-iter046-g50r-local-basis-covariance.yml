name: RCG Iter046 G50-R Local Basis Covariance

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER046_G50R_LAUNCH.md'

jobs:
  basis-audit:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        rotation_seed: [4601, 4602, 4603, 4604]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G50-R basis lane
        run: |
          mkdir -p out
          python scripts/iter046_g50r_local_basis_covariance.py --rotation-seed '${{ matrix.rotation_seed }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg046-g50r-r${{ matrix.rotation_seed }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: basis-audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G50-R rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==16 and all(r.get('structural_valid',False) for r in rows))
          support=bool(structural and all(r.get('lane_support',False) for r in rows))
          meth=[m for r in rows for m in r.get('methods',[])]
          worst_gap=max([max(m['train_gap_delta'],m['holdout_gap_delta']) for m in meth],default=None)
          worst_direct=max([m['max_direct_discrepancy'] for m in meth],default=None)
          worst_trace=max([m['max_trace_residual'] for m in meth],default=None)
          min_eig=min([m['min_output_eigenvalue'] for m in meth],default=None)
          if not structural: cls='G50R_IMPLEMENTATION_OR_NUMERICAL_INVALID'
          elif support: cls='DERIVED_SCOPED_G50A_LOCAL_BASIS_COVARIANT_SUPPORT'
          else: cls='G50R_FROZEN_ROBUSTNESS_RULE_NOT_MET'
          summary={'iteration':'Iter046','gate':'G50-R','n_results':len(rows),'all_structural_valid':structural,'scientific_support':support,'worst_gap_invariance_delta':worst_gap,'worst_direct_implementation_discrepancy':worst_direct,'worst_trace_residual':worst_trace,'minimum_output_eigenvalue':min_eig,'classification':cls,'scope_lock':'Local-unitary basis covariance of exact terminal G50-A finite-panel separation only; no family expansion or all-classical no-go.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg046-g50r-summary
          path: summary/summary.json
