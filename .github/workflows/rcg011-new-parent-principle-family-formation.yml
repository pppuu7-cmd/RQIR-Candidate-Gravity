name: RCG011 New Parent-Principle Family Formation

on:
  push:
    paths:
      - 'prereg/RCG011_EXECUTION_IDENTITY_FREEZE.json'

permissions:
  contents: read

jobs:
  constructor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/rcg011_verify_execution_identity.py
      - run: python scripts/rcg011_parent_principle_family_constructor.py --manifest data/RCG011_NEW_PARENT_PRINCIPLE_FAMILY_FORMATION_AUTHORITY_V0.json --out out/constructor.json
      - run: cat out/constructor.json
      - uses: actions/upload-artifact@v4
        with: {name: rcg011-constructor, path: out/constructor.json, if-no-files-found: error}

  critic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/rcg011_verify_execution_identity.py
      - run: python scripts/rcg011_parent_principle_family_critic.py --manifest data/RCG011_NEW_PARENT_PRINCIPLE_FAMILY_FORMATION_AUTHORITY_V0.json --out out/critic.json
      - run: cat out/critic.json
      - uses: actions/upload-artifact@v4
        with: {name: rcg011-critic, path: out/critic.json, if-no-files-found: error}

  aggregate:
    needs: [constructor, critic]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: rcg011-constructor, path: in/constructor}
      - uses: actions/download-artifact@v4
        with: {name: rcg011-critic, path: in/critic}
      - run: python scripts/rcg011_parent_principle_family_aggregate.py --constructor in/constructor/constructor.json --critic in/critic/critic.json --out out/aggregate.json
      - run: cat out/aggregate.json
      - uses: actions/upload-artifact@v4
        with: {name: rcg011-aggregate, path: out/aggregate.json, if-no-files-found: error}

  auditor:
    needs: [aggregate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: rcg011-aggregate, path: in/aggregate}
      - run: python scripts/rcg011_parent_principle_family_auditor.py --manifest data/RCG011_NEW_PARENT_PRINCIPLE_FAMILY_FORMATION_AUTHORITY_V0.json --aggregate in/aggregate/aggregate.json --out out/audit.json
      - run: cat out/audit.json
      - uses: actions/upload-artifact@v4
        with: {name: rcg011-independent-audit, path: out/audit.json, if-no-files-found: error}
