name: RCG Iter034 G46-C Extended Trace-Ball Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER034_G46C_LAUNCH.md'

jobs:
  calibrate:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cap: [8, 16]
        method: [sobol_lsq, lhs_lsq]
        rank: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G46-C positive-control lane
        run: |
          mkdir -p out
          python scripts/iter034_g46c_extended_trace_ball_calibration.py --cap '${{ matrix.cap }}' --method '${{ matrix.method }}' --rank '${{ matrix.rank }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg034-g46c-cap${{ matrix.cap }}-${{ matrix.method }}-r${{ matrix.rank }}
          path: out/result.json

  aggregate:
    needs: calibrate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G46-C rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==24 and all(r['structural_valid'] for r in rows))
          support=bool(structural and all(r['scientific_support'] for r in rows))
          by_cap={}
          for cap in (8.0,16.0):
              rr=[r for r in rows if float(r['trace_cap'])==cap]
              by_cap[str(int(cap))]={
                  'n':len(rr),
                  'support_count':sum(int(r['scientific_support']) for r in rr),
                  'worst_gap':max((r['best_candidate']['gap'] for r in rr),default=None),
                  'worst_relative_C_error':max((r['best_candidate']['relative_kossakowski_error'] for r in rr),default=None),
                  'rank_match_count':sum(int(r['best_candidate']['recovered_effective_rank']==r['rank']) for r in rr),
              }
          summary={
              'iteration':'Iter034','gate':'G46-C','n_results':len(rows),
              'all_structural_valid':structural,'scientific_support':support,'by_cap':by_cap,
              'classification':'EXTENDED_TRACE_BALL_PSD_OPTIMIZER_CALIBRATED_CAP8_CAP16' if support else 'EXTENDED_TRACE_BALL_PSD_OPTIMIZER_CALIBRATION_NOT_ESTABLISHED',
              'scope_lock':'Response-blind calibration only for fixed real-PSD trace caps 8 and 16; no RCG-002 target.',
              'interpretation':'Calibration only; PASS may authorize only a separately preregistered adversarial gate and cannot raise readiness.'
          }
          os.makedirs('summary',exist_ok=True)
          open('summary/summary.json','w').write(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg034-g46c-summary
          path: summary/summary.json
