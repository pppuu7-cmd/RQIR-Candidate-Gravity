name: RCG Iter064 G66 gauge sector independence audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/iter064_g66_gauge_sector_independence.py'
      - '.github/workflows/rcg-iter064-g66-gauge-sector-independence.yml'
  workflow_dispatch:

jobs:
  stream:
    strategy:
      fail-fast: false
      matrix:
        stream: [A, B, C, D]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/iter064_g66_gauge_sector_independence.py --stream ${{ matrix.stream }} --out out/${{ matrix.stream }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g66-${{ matrix.stream }}
          path: out/${{ matrix.stream }}.json

  aggregate:
    needs: stream
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g66-*
          path: downloaded
      - run: find downloaded -maxdepth 3 -type f -print
      - run: python scripts/iter064_g66_gauge_sector_independence.py --aggregate-dir downloaded --out summary/g66_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: g66-aggregate
          path: summary/g66_summary.json
