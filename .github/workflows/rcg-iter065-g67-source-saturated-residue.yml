name: RCG Iter065 G67 source saturated pole residue audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/iter065_g67_source_saturated_residue.py'
      - '.github/workflows/rcg-iter065-g67-source-saturated-residue.yml'
  workflow_dispatch:

jobs:
  stream:
    strategy:
      fail-fast: false
      matrix:
        stream: [A, B, C, D, E]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/iter065_g67_source_saturated_residue.py --stream ${{ matrix.stream }} --out out/${{ matrix.stream }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g67-${{ matrix.stream }}
          path: out/${{ matrix.stream }}.json

  aggregate:
    needs: stream
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g67-*
          path: downloaded
      - run: find downloaded -maxdepth 3 -type f -print
      - run: python scripts/iter065_g67_source_saturated_residue.py --aggregate-dir downloaded --out summary/g67_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: g67-aggregate
          path: summary/g67_summary.json
