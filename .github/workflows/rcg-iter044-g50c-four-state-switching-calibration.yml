name: RCG Iter044 G50-C Four-State Switching Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER044_G50C_LAUNCH.md'

jobs:
  calibration:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        method: [sobol_lsq, lhs_lsq]
        control: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G50-C calibration lane
        run: |
          mkdir -p out
          python scripts/iter044_g50c_four_state_switching_calibration.py --method '${{ matrix.method }}' --control '${{ matrix.control }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg044-g50c-${{ matrix.method }}-c${{ matrix.control }}
          path: out/result.json

  aggregate:
    needs: calibration
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G50-C calibration rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==8 and all(r.get('structural_valid',False) for r in rows))
          lane_support=bool(structural and all(r.get('scientific_support',False) for r in rows))
          pairs=[]
          for c in range(4):
              rr=[r for r in rows if r.get('control')==c]
              gaps=sorted([r['best_candidate']['train_max_trace_gap'] for r in rr])
              ok=bool(len(rr)==2 and abs(gaps[1]-gaps[0])<=0.002)
              pairs.append({'control':c,'train_gaps':gaps,'difference':abs(gaps[1]-gaps[0]) if len(gaps)==2 else None,'agreement':ok})
          support=bool(lane_support and all(p['agreement'] for p in pairs))
          if not structural: cls='G50C_IMPLEMENTATION_OR_NUMERICAL_INVALID'
          elif support: cls='FOUR_STATE_CLASSICAL_SWITCHING_OPTIMIZER_CALIBRATED'
          else: cls='G50C_FROZEN_CALIBRATION_RULE_NOT_MET'
          summary={'iteration':'Iter044','gate':'G50-C','n_results':len(rows),'all_structural_valid':structural,'all_lane_support':lane_support,'pairs':pairs,'scientific_support':support,'classification':cls,'scope_lock':'Response-blind optimizer calibration only for explicit finite 20D four-state hidden-classical switching family.','interpretation':'Calibration only; no RCG-002 separation or universal no-go claim.'}
          os.makedirs('summary',exist_ok=True)
          open('summary/summary.json','w').write(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg044-g50c-summary
          path: summary/summary.json
