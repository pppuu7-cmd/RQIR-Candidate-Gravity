name: RCG Iter063 G65 full conserved source projector audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/iter063_g65_full_conserved_projector.py'
      - '.github/workflows/rcg-iter063-g65-full-conserved-projector.yml'
  workflow_dispatch:

jobs:
  stream:
    strategy:
      fail-fast: false
      matrix:
        stream: [A, B, C, D]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/iter063_g65_full_conserved_projector.py --stream ${{ matrix.stream }} --out out/${{ matrix.stream }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g65-${{ matrix.stream }}
          path: out/${{ matrix.stream }}.json

  aggregate:
    needs: stream
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g65-*
          path: downloaded
      - run: find downloaded -maxdepth 3 -type f -print
      - run: python scripts/iter063_g65_full_conserved_projector.py --aggregate-dir downloaded --out summary/g65_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: g65-aggregate
          path: summary/g65_summary.json
