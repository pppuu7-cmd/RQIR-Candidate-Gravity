name: RCG Iter009 G27 Rotated Axis Master Equation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rotated-axis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        scale: ['0.5','1.0','2.0','4.0']
        theta: ['0.025','0.05','0.10','0.20','0.35','0.50']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy
      - name: Run G27 rotated-axis audit
        run: |
          mkdir -p out
          TAG="s${{ matrix.scale }}-t${{ matrix.theta }}"
          python scripts/iter009_rotated_axis_master_equation.py --scale '${{ matrix.scale }}' --theta '${{ matrix.theta }}' --tag "$TAG" --out "out/$TAG.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rcg009-s${{ matrix.scale }}-t${{ matrix.theta }}
          path: out/*.json

  aggregate:
    if: always()
    needs: rotated-axis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate G27
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          s={
            'iteration':'Iter009','gate':'G27','n_results':len(rows),
            'structural_passes':sum(bool(r['pass']) for r in rows),
            'nonzero_gap_count':sum(bool(r['scientific_support']['nonzero_global_gap']) for r in rows),
            'zz_stable_count':sum(bool(r['scientific_support']['rotations_do_not_beat_ZZ_by_1pct']) for r in rows),
            'max_rotation_improvement':max([r['improvement_fraction'] for r in rows],default=None),
            'all_structural_pass':len(rows)==24 and all(r['pass'] for r in rows),
            'scope_lock':'Finite X-Z-plane local-axis Markovian comparator family only.'
          }
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(s,indent=2)); print(json.dumps(s,indent=2))
          if not s['all_structural_pass']: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg009-summary
          path: summary/summary.json
