name: RCG G91 frozen terminal validation
on:
  push:
    branches: [g91-d-covariant-quartic-lift]
    paths:
      - '.github/workflows/iter089_g91_terminal_validation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip sympy
      - name: Re-run frozen lanes
        run: |
          mkdir -p raw
          for lane in A B C D; do
            python scripts/iter089_g91_d_covariant_quartic_lift.py --lane "$lane" --out "raw/g91-$lane.json"
          done
      - name: Validate frozen classifications and write terminal note
        shell: python
        run: |
          import hashlib, json, os, pathlib, sys
          expected={
            'A':'D_COVARIANT_QUARTIC_DENSITIES_START_AT_FOURTH_ORDER_SCOPED',
            'B':'D_COVARIANT_QUARTIC_INVARIANTS_POINTWISE_INDEPENDENT_SCOPED',
            'C':'D_COVARIANT_QUARTIC_CTP_FAMILY_PRESERVES_CUBIC_STRUCTURE_SCOPED',
            'D':'D_COVARIANT_LIFT_ORDER_AND_INDEPENDENCE_CONTROLS_SCOPED'}
          rows={}; digests={}
          for lane in 'ABCD':
            p=pathlib.Path(f'raw/g91-{lane}.json')
            b=p.read_bytes(); r=json.loads(b); rows[lane]=r
            digests[lane]=hashlib.sha256(b).hexdigest()
          valid=(set(rows)==set(expected) and all(rows[k].get('valid') is True and rows[k].get('classification')==v for k,v in expected.items()))
          if not valid: sys.exit('Frozen G91 validation failed')
          out=pathlib.Path('results/ITER089_G91_D_COVARIANT_QUARTIC_LIFT_TERMINAL.md')
          out.parent.mkdir(parents=True,exist_ok=True)
          text=f'''# Iter089 / G91 — D explicit covariant quartic lift — TERMINAL

Date: 2026-09-13
Classification: `BLOCKED_D_EXPLICIT_COVARIANT_QUARTIC_INVARIANT_FAMILY_PRESERVES_FROZEN_CUBIC_DATA_SCOPED`
Scientific status: **BLOCKED / COVARIANT FAMILY UNDERDETERMINED, scoped**
Programme readiness: **66%**
Theory established: **0%**

## Terminal validation authority
- validation head: `{os.environ.get('GITHUB_SHA','')}`
- validation run: `{os.environ.get('GITHUB_RUN_ID','')}`
- raw lane SHA-256: A `{digests['A']}`, B `{digests['B']}`, C `{digests['C']}`, D `{digests['D']}`

## Frozen result
- A `{expected['A']}`: both explicit densities begin at formal fourth order and preserve all frozen D data through cubic order.
- B `{expected['B']}`: `R^4` and `R^2 R_{{mu nu}}R^{{mu nu}}` give an exact rank-two E/P evaluation matrix; proportional/zero/background controls behave as frozen.
- C `{expected['C']}`: the branch-difference covariant family is exactly CTP-normalized through cubic order while the frozen D cubic kernel remains unchanged, retarded and Sigma-symmetric.
- D `{expected['D']}`: `R^3` is correctly rejected as lower-order contamination; proportional/zero/one-background controls do not fake two-dimensional independence.

## Scientific interpretation
Within this prospectively frozen explicit local generally covariant two-invariant family, bare covariance and the frozen lower-order D information do not select a unique quartic completion. This strengthens G87/G89 but remains a finite family witness.

## Scope ceiling
No completeness modulo field redefinitions, integrations by parts or dimension-specific identities is claimed. No quartic retarded/unitary/measure closure or physical completion is established. Readiness remains 66%; `THEORY_ESTABLISHED=0%`.
'''
          out.write_text(text)
      - uses: actions/upload-artifact@v4
        with:
          name: g91-terminal-validation-raw
          path: |
            raw/g91-*.json
            results/ITER089_G91_D_COVARIANT_QUARTIC_LIFT_TERMINAL.md
      - name: Commit terminal note
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/ITER089_G91_D_COVARIANT_QUARTIC_LIFT_TERMINAL.md
          git commit -m "Record terminal G91 covariant quartic lift" || exit 0
          git push
