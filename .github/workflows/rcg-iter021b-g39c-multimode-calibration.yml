name: RCG Iter021B G39-C Multimode Optimizer Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER021B_G39C_LAUNCH.md'

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        rank: [2, 3]
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G39-C positive-control lane
        run: |
          mkdir -p out
          python scripts/iter021b_g39c_multimode_optimizer_calibration.py --rank '${{ matrix.rank }}' --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg021b-g39c-r${{ matrix.rank }}-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: calibrate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G39-C rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          ranks=(2,3); methods=('sobol_lsq','lhs_lsq'); tol=0.002
          structural=bool(len(rows)==16 and all(r['structural_valid'] for r in rows))
          by_rank={}
          for K in ranks:
              by_rank[str(K)]={}
              for m in methods:
                  rr=[r for r in rows if r['rank']==K and r['method']==m]
                  by_rank[str(K)][m]={'n':len(rr),'support_count':sum(int(r['result']['scientific_support']) for r in rr),'worst_trace_gap':max((r['result']['best_trace_gap'] for r in rr),default=None),'all_support':bool(len(rr)==4 and all(r['result']['scientific_support'] for r in rr))}
              by_rank[str(K)]['rank_calibrated']=bool(all(by_rank[str(K)][m]['all_support'] for m in methods))
          support=bool(structural and all(by_rank[str(K)]['rank_calibrated'] for K in ranks))
          s={'iteration':'Iter021B','gate':'G39-C','n_results':len(rows),'all_structural_valid':structural,'by_rank':by_rank,'scientific_support':support,'frozen_recovery_tolerance':tol,'interpretation':'Positive-control optimizer calibration only. Each rank is separately authorized for adversarial testing only if both methods recover all four frozen controls.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(s,indent=2)); print(json.dumps(s,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg021b-g39c-summary
          path: summary/summary.json
