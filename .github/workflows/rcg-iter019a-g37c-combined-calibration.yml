name: RCG Iter019A G37-C Combined Comparator Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER019A_G37C_LAUNCH.md'

jobs:
  positive:
    strategy:
      fail-fast: false
      matrix:
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G37-C positive-control lane
        run: |
          mkdir -p out
          python scripts/iter019a_g37c_combined_comparator_calibration.py --stream positive_control --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg019a-g37c-positive-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  admissibility:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G37-C admissibility lane
        run: |
          mkdir -p out
          python scripts/iter019a_g37c_combined_comparator_calibration.py --stream admissibility --method none --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg019a-g37c-admissibility-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: [positive, admissibility]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G37-C calibration
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          methods=('sobol_lsq','lhs_lsq'); tol=0.002
          structural=bool(len(rows)==16 and all(r['structural_valid'] for r in rows))
          pos=[r for r in rows if r['stream']=='positive_control']; adm=[r for r in rows if r['stream']=='admissibility']
          by_method={}
          for m in methods:
              rr=[r for r in pos if r['method']==m]
              by_method[m]={'n':len(rr),'support_count':sum(int(r['result']['scientific_support']) for r in rr),'worst_trace_gap':max((r['result']['best_trace_gap'] for r in rr),default=None),'all_support':bool(len(rr)==6 and all(r['result']['scientific_support'] for r in rr))}
          per_shard={}
          for s in range(6):
              rr={r['method']:r for r in pos if r['shard']==s}
              gaps={m:rr[m]['result']['best_trace_gap'] for m in methods if m in rr}
              per_shard[str(s)]={'gaps':gaps,'both_recover':bool(len(gaps)==2 and all(v<tol for v in gaps.values()))}
          adm_support=bool(len(adm)==4 and all(r['result']['scientific_support'] for r in adm))
          support=bool(structural and adm_support and all(by_method[m]['all_support'] for m in methods) and all(v['both_recover'] for v in per_shard.values()))
          summary={'iteration':'Iter019A','gate':'G37-C','n_results':len(rows),'all_structural_valid':structural,'by_method':by_method,'per_shard':per_shard,'admissibility':{'n':len(adm),'all_support':adm_support},'scientific_support':support,'frozen_recovery_tolerance':tol,'interpretation':'Prospective positive-control calibration for the combined K=2 measurement-feedback + shared-classical-noise finite comparator. PASS only authorizes a separate RCG-002 adversarial gate.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg019a-g37c-summary
          path: summary/summary.json
