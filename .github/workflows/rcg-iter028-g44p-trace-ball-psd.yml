name: RCG Iter028 G44-P Basis-Invariant Trace-Ball PSD

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER028_G44P_LAUNCH.md'

jobs:
  validate:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        rank: [1, 2, 3, 4, 5, 6]
        panel: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G44-P lane
        run: |
          mkdir -p out
          python scripts/iter028_g44p_basis_invariant_trace_ball_psd.py --rank '${{ matrix.rank }}' --panel '${{ matrix.panel }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg028-g44p-r${{ matrix.rank }}-p${{ matrix.panel }}
          path: out/result.json

  aggregate:
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G44-P rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          structural=bool(len(rows)==24 and all(r['structural_valid'] for r in rows))
          support=bool(structural and all(r['scientific_support'] for r in rows))
          by_rank={}
          for rank in range(1,7):
              rr=[r for r in rows if r['rank']==rank]
              by_rank[str(rank)]={
                  'n':len(rr),
                  'support_count':sum(int(r['scientific_support']) for r in rr),
                  'max_reconstruction_error':max((max(r['original']['reconstruction_relative_error'],r['rotated']['reconstruction_relative_error']) for r in rr),default=None),
                  'max_covariance_error':max((r['basis_covariance']['relative_generator_error'] for r in rr),default=None),
                  'max_sqrt_frobenius_norm':max((max(r['original']['sqrt_frobenius_norm'],r['rotated']['sqrt_frobenius_norm']) for r in rr),default=None),
              }
          summary={
              'iteration':'Iter028','gate':'G44-P','n_results':len(rows),
              'all_structural_valid':structural,'scientific_support':support,'by_rank':by_rank,
              'old_G42_box_analytically_nested':bool(rows and all(r['analytic_nesting']['old_box_fully_nested'] for r in rows)),
              'classification':'BASIS_INVARIANT_TRACE_BALL_PSD_REPRESENTATION_VALIDATED' if support else 'TRACE_BALL_REPRESENTATION_OR_COVARIANCE_FAIL',
              'scope_lock':'Basis-invariant bounded PSD trace-ball tr(C)<=4 only; representation/covariance pre-gate, no RCG-002 target.',
              'interpretation':'PASS may authorize separate positive-control optimizer calibration only; no readiness increment.'
          }
          os.makedirs('summary',exist_ok=True)
          open('summary/summary.json','w').write(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg028-g44p-summary
          path: summary/summary.json
