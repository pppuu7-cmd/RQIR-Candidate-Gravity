name: RCG Iter057 G59 two-derivative constitution freedom

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/rcg-iter057-g59-two-derivative-constitution.yml'
  workflow_dispatch:

jobs:
  stream:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        stream: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - run: python scripts/iter057_g59_two_derivative_constitution.py --stream ${{ matrix.stream }} --out out/${{ matrix.stream }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g59-${{ matrix.stream }}
          path: out/${{ matrix.stream }}.json

  aggregate:
    needs: stream
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - run: find downloaded -maxdepth 3 -type f -print
      - run: python scripts/iter057_g59_two_derivative_constitution.py --aggregate-dir downloaded --out summary/g59_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: g59-aggregate
          path: summary/g59_summary.json
