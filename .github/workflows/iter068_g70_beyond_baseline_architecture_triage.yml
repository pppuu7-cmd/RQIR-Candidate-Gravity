name: RCG Iter068 G70 beyond-baseline architecture triage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter068_g70_beyond_baseline_architecture_triage.yml'
  workflow_dispatch:

jobs:
  stream:
    strategy:
      fail-fast: false
      matrix:
        stream: [A, B, C, D, E]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip sympy
      - name: Run frozen stream ${{ matrix.stream }}
        run: |
          mkdir -p out
          python scripts/iter068_g70_beyond_baseline_architecture_triage.py --stream '${{ matrix.stream }}' --out 'out/${{ matrix.stream }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: g70-${{ matrix.stream }}
          path: out/${{ matrix.stream }}.json
          if-no-files-found: error

  aggregate:
    needs: stream
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: g70-*
          path: downloaded
          merge-multiple: false
      - name: Frozen aggregate
        run: |
          mkdir -p out
          python scripts/iter068_g70_beyond_baseline_architecture_triage.py --aggregate-dir downloaded --out out/g70_aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g70-aggregate
          path: out/g70_aggregate.json
          if-no-files-found: error
