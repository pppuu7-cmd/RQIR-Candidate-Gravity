name: RCG002 NCP1 noisy completion positivity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rcg002_ncp1.yml']
permissions:
  contents: read
concurrency:
  group: rqircg-ncp1-authority
  cancel-in-progress: false
jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Verify frozen input identities
        run: |
          test "$(git hash-object scripts/iter070_g72_cd_minimal_completion_existence.py)" = 8f67e57e3399b37f5e2ddb79d756932f7ce3200e
          echo 'a013741d687cd3f0d474d6091d856fc9f891d05f94355aa0f064c13e0d6676fc  scripts/rcg002_ncp1.py' | sha256sum -c -
          mkdir -p out
          printf '%s\n' "$GITHUB_SHA" > out/production_commit.txt
          sha256sum prereg/RCG002_NCP1_NOISY_COMPLETION_POSITIVITY.md scripts/rcg002_ncp1.py > out/source_hashes.txt
      - name: Execute frozen independent lane
        run: python scripts/rcg002_ncp1.py --lane ${{ matrix.lane }} --out out/ncp1_${{ matrix.lane }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncp1-${{ matrix.lane }}
          path: out/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: ncp1-*
          path: raw
      - name: Combine exactly four terminal lane payloads
        run: |
          python scripts/rcg002_ncp1.py --aggregate raw/ncp1-A/ncp1_A.json raw/ncp1-B/ncp1_B.json raw/ncp1-C/ncp1_C.json raw/ncp1-D/ncp1_D.json --out out/ncp1_summary.json
          cp -r raw out/raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncp1-bundle
          path: out/
          if-no-files-found: error
          retention-days: 90
