name: Post-freeze gravity-specific wave 2

on:
  push:
    branches:
      - post-freeze-gravity-specific-wave2
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  spin2-positive-spectral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip scipy numpy
      - run: python compute_wave2/spin2_positive_spectral.py
      - uses: actions/upload-artifact@v4
        with:
          name: spin2-positive-spectral
          path: wave2_results/

  ward-transverse-form-factors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy
      - run: python compute_wave2/ward_transverse_form_factors.py
      - uses: actions/upload-artifact@v4
        with:
          name: ward-transverse-form-factors
          path: wave2_results/

  causal-retarded-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip scipy numpy
      - run: python compute_wave2/causal_retarded_shape.py
      - uses: actions/upload-artifact@v4
        with:
          name: causal-retarded-shape
          path: wave2_results/

  local-q4-tt-poles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python compute_wave2/local_q4_tt_poles.py
      - uses: actions/upload-artifact@v4
        with:
          name: local-q4-tt-poles
          path: wave2_results/

  aggregate-wave2:
    if: always()
    needs: [spin2-positive-spectral, ward-transverse-form-factors, causal-retarded-shape, local-q4-tt-poles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: wave2_downloads
      - run: python compute_wave2/aggregate_wave2.py
      - uses: actions/upload-artifact@v4
        with:
          name: gravity-wave2-summary
          path: wave2_summary.json
