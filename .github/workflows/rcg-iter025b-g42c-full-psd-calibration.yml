name: RCG Iter025B G42-C Full PSD Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'protocol/ITER025B_G42C_LAUNCH.md'

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        method: [sobol_lsq, lhs_lsq]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G42-C calibration lane
        run: |
          mkdir -p out
          python scripts/iter025b_g42c_full_psd_optimizer_calibration.py --method '${{ matrix.method }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg025b-g42c-${{ matrix.method }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    needs: calibrate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate frozen G42-C rule
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          methods=('sobol_lsq','lhs_lsq')
          structural=bool(len(rows)==8 and all(r['structural_valid'] for r in rows))
          by={}
          for m in methods:
              rr=[r for r in rows if r['method']==m]
              by[m]={'n':len(rr),'support_count':sum(int(r['scientific_support']) for r in rr),'worst_recovery_gap':max((r['best_candidate']['gap'] for r in rr),default=None),'min_recovered_kossakowski_eigenvalue':min((r['best_candidate']['min_kossakowski_eigenvalue'] for r in rr),default=None),'all_support':bool(len(rr)==4 and all(r['scientific_support'] for r in rr))}
          support=bool(structural and all(by[m]['all_support'] for m in methods))
          summary={'iteration':'Iter025B','gate':'G42-C','n_results':len(rows),'all_structural_valid':structural,'by_method':by,'scientific_support':support,
                   'classification':'FULL_PSD_OPTIMIZER_CALIBRATED' if support else 'FULL_PSD_OPTIMIZER_CALIBRATION_NOT_CLOSED',
                   'frozen_recovery_tolerance':0.002,
                   'interpretation':'Full-PSD positive-control optimizer calibration only. PASS may authorize a separate prospective adversarial gate with identical search/family rules.'}
          os.makedirs('summary',exist_ok=True); open('summary/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          if not structural: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg025b-g42c-summary
          path: summary/summary.json
