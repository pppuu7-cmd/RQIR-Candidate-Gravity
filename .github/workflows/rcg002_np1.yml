name: RCG002 NP1 connected extension nonuniqueness

on:
  push:
    branches: [ main ]
    paths:
      - 'prereg/RCG002_NP1_CONNECTED_CHANNEL_EXTENSION_NONUNIQUENESS.md'
      - 'scripts/rcg002_np1_connected_extension.py'
      - '.github/workflows/rcg002_np1.yml'
  workflow_dispatch:

jobs:
  lanes:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Verify frozen identities
        run: |
          grep -q '1c63d49ccfbc0978c0d791fabd335a00186fa4f4' scripts/rcg002_np1_connected_extension.py
          grep -q '94467fdacc93f65102333fa01b7a34bb0d857a79' scripts/rcg002_np1_connected_extension.py
      - name: Execute independent lane
        run: |
          mkdir -p out
          python scripts/rcg002_np1_connected_extension.py --lane "${{ matrix.lane }}" --out "out/np1_${{ matrix.lane }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: np1-${{ matrix.lane }}
          path: out/np1_${{ matrix.lane }}.json
          if-no-files-found: error

  aggregate:
    needs: lanes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: np1-*
          path: raw
          merge-multiple: true
      - name: Aggregate only after all four lanes terminal
        run: |
          python scripts/rcg002_np1_connected_extension.py \
            --aggregate raw/np1_A.json raw/np1_B.json raw/np1_C.json raw/np1_D.json \
            --out np1_aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: np1-aggregate
          path: np1_aggregate.json
          if-no-files-found: error
