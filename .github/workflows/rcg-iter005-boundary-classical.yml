name: RCG Iter005 Noise Boundary and Classical Comparator

on:
  push:
    branches: [main]
    paths:
      - 'scripts/iter005_noise_boundary_and_classical_comparator.py'
      - '.github/workflows/rcg-iter005-boundary-classical.yml'
  workflow_dispatch:

jobs:
  gate-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        include:
          - {gate: boundary, arg: '0.5:-0.6', label: b-s05-rm06}
          - {gate: boundary, arg: '0.5:0.0', label: b-s05-r00}
          - {gate: boundary, arg: '0.5:0.6', label: b-s05-r06}
          - {gate: boundary, arg: '1.0:-0.6', label: b-s10-rm06}
          - {gate: boundary, arg: '1.0:0.0', label: b-s10-r00}
          - {gate: boundary, arg: '1.0:0.6', label: b-s10-r06}
          - {gate: boundary, arg: '2.0:-0.6', label: b-s20-rm06}
          - {gate: boundary, arg: '2.0:0.0', label: b-s20-r00}
          - {gate: boundary, arg: '2.0:0.6', label: b-s20-r06}
          - {gate: boundary, arg: '4.0:-0.6', label: b-s40-rm06}
          - {gate: boundary, arg: '4.0:0.0', label: b-s40-r00}
          - {gate: boundary, arg: '4.0:0.6', label: b-s40-r06}
          - {gate: classical, arg: '-0.9:0.2', label: c-m09-t02}
          - {gate: classical, arg: '-0.6:0.7', label: c-m06-t07}
          - {gate: classical, arg: '-0.2:1.1', label: c-m02-t11}
          - {gate: classical, arg: '0.0:0.4', label: c-00-t04}
          - {gate: classical, arg: '0.2:1.4', label: c-02-t14}
          - {gate: classical, arg: '0.6:0.9', label: c-06-t09}
          - {gate: classical, arg: '0.9:1.2', label: c-09-t12}
          - {gate: classical, arg: '0.7:2.0', label: c-07-t20}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy
      - name: Run Iter005 preregistered gate
        run: |
          mkdir -p out
          python scripts/iter005_noise_boundary_and_classical_comparator.py --gate='${{ matrix.gate }}' --arg='${{ matrix.arg }}' --out='out/${{ matrix.label }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: rcg005-${{ matrix.label }}
          path: out/${{ matrix.label }}.json

  aggregate:
    if: always()
    needs: gate-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rcg005-*
          path: artifacts
      - name: Aggregate Iter005 outcomes
        run: |
          python - <<'PY'
          import glob,json,math,os,statistics
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          b=[r for r in rows if r['gate']=='G22_NOISE_ENTANGLEMENT_BOUNDARY']
          c=[r for r in rows if r['gate']=='G23_CLASSICAL_MEASURE_PREPARE_COMPARATOR']
          bycorr={}
          for r in b:
              bycorr.setdefault(str(r['corr']),[]).append(r)
          scaling={}
          for corr,rs in bycorr.items():
              rs=sorted(rs,key=lambda x:abs(x['chi']))
              x=[math.log(abs(r['chi'])) for r in rs]
              y=[math.log(r['gamma_critical']) for r in rs]
              xm=sum(x)/len(x); ym=sum(y)/len(y)
              slope=sum((a-xm)*(bb-ym) for a,bb in zip(x,y))/sum((a-xm)**2 for a in x)
              ratios=[r['gamma_c_over_abs_chi'] for r in rs]
              scaling[corr]={'slope':slope,'ratio_mean':statistics.mean(ratios),'ratio_cv':statistics.pstdev(ratios)/abs(statistics.mean(ratios))}
          s={'candidate':'RCG-003-unified','iteration':'ITER005','n_results':len(rows),'boundary_results':len(b),'classical_results':len(c),'boundary_scaling':scaling,'all_lane_pass':len(rows)==20 and all(r['pass'] for r in rows)}
          os.makedirs('summary',exist_ok=True)
          with open('summary/summary.json','w') as f: json.dump(s,f,indent=2)
          print(json.dumps(s,indent=2))
          if not s['all_lane_pass']: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg005-iter005-summary
          path: summary/summary.json
