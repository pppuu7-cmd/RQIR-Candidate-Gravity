name: RCG Iter014 G32 Optimizer Calibration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/iter014_optimizer_calibration_diagnostic.py'
      - '.github/workflows/rcg-iter014-optimizer-calibration.yml'
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        stream: [oracle_replay, swap_symmetry, local_basin, deep_global, hybrid_global_local]
        shard: ['0','1','2','3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy
      - name: Run frozen G32 lane
        run: |
          mkdir -p out
          python scripts/iter014_optimizer_calibration_diagnostic.py --stream '${{ matrix.stream }}' --shard '${{ matrix.shard }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg014-${{ matrix.stream }}-s${{ matrix.shard }}
          path: out/result.json

  aggregate:
    if: always()
    needs: calibrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate G32 without converting scientific FAIL into CI failure
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in glob.glob('artifacts/**/*.json',recursive=True):
              with open(p) as f: rows.append(json.load(f))
          by={}
          for r in rows:
              x=by.setdefault(r['stream'],{'n':0,'structural_valid':0,'scientific_support':0})
              x['n']+=1
              x['structural_valid']+=int(r['structural_valid'])
              x['scientific_support']+=int(r['result']['scientific_support'])
          def vals(stream,key):
              return [r['result'][key] for r in rows if r['stream']==stream]
          oracle=vals('oracle_replay','oracle_gap')
          lswap=vals('swap_symmetry','liouvillian_swap_norm')
          tswap=vals('swap_symmetry','target_swap_gap')
          local=vals('local_basin','recovery_gap')
          deep=vals('deep_global','recovery_gap')
          hybrid=vals('hybrid_global_local','recovery_gap')
          all_structural=(len(rows)==20 and all(r['structural_valid'] for r in rows))
          plumbing_valid=(len(oracle)==4 and max(oracle)<1e-10 and len(lswap)==4 and len(tswap)==4 and max(lswap+tswap)<1e-10)
          local_calibrated=(len(local)==4 and max(local)<2e-3)
          deep_calibrated=(len(deep)==4 and max(deep)<2e-3)
          hybrid_calibrated=(len(hybrid)==4 and max(hybrid)<2e-3)
          any_global_calibrated=deep_calibrated or hybrid_calibrated
          if not all_structural:
              diagnosis='INFRASTRUCTURE_OR_NUMERICAL_INVALID'
          elif not plumbing_valid:
              diagnosis='PARAMETERIZATION_OR_OBJECTIVE_PLUMBING_FAIL'
          elif not local_calibrated:
              diagnosis='LOCAL_BASIN_OR_OBJECTIVE_GEOMETRY_FAIL'
          elif not any_global_calibrated:
              diagnosis='GLOBAL_SEARCH_BUDGET_OR_ALGORITHM_UNCALIBRATED'
          else:
              diagnosis='POSITIVE_CONTROL_METHOD_CALIBRATED'
          s={
            'iteration':'Iter014','gate':'G32','n_results':len(rows),'streams':by,
            'all_structural_valid':all_structural,
            'max_oracle_gap':max(oracle) if oracle else None,
            'max_swap_liouvillian_norm':max(lswap) if lswap else None,
            'max_swap_target_gap':max(tswap) if tswap else None,
            'max_local_recovery_gap':max(local) if local else None,
            'max_deep_global_recovery_gap':max(deep) if deep else None,
            'max_hybrid_recovery_gap':max(hybrid) if hybrid else None,
            'plumbing_valid':plumbing_valid,
            'local_calibrated':local_calibrated,
            'deep_global_calibrated':deep_calibrated,
            'hybrid_global_local_calibrated':hybrid_calibrated,
            'any_global_method_calibrated':any_global_calibrated,
            'diagnosis':diagnosis,
            'scientific_rule':'Adversarial interpretation remains blocked unless a prospectively specified positive-control global method calibrates. If calibrated, adversarial K=2/3/4 must be rerun under that exact method; G31 gaps cannot be promoted retroactively.',
            'scope_lock':'Positive-control optimizer diagnostics only; RCG-002 adversarial target forbidden in G32.'
          }
          os.makedirs('summary',exist_ok=True)
          open('summary/summary.json','w').write(json.dumps(s,indent=2))
          print(json.dumps(s,indent=2))
          if not all_structural:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcg014-summary
          path: summary/summary.json
